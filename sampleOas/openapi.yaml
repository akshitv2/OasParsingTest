openapi: 3.0.3
info:
  title: Micro-Service API
  version: 1.0.0
paths:
  /users/{userId}:
    get:
      summary: Get a user by ID
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            minLength: 3
      responses:
        '200':
          description: Successful request
          content:
            application/json:
              schema:
                # Reference to the external Schema file
                $ref: './schemas.yaml#/User'
        '404':
          # Reference to the external Responses file
          $ref: './responses.yaml#/NotFound'